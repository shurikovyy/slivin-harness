# Copy this file to harness.local.toml and adjust machine-local paths.
# harness.local.toml is ignored and must not be committed or shipped.

[codex]
command = "C:/Users/<user>/Tools/codex-cli/node_modules/.bin/codex.cmd"

[workspace]
# Keep this path short on Windows.
root = "C:/Users/<user>/.slivin-harness/workspaces"

[toolchain]
# Optional tools shared by all projects. Repair checks and Implementer self-verify use these exact paths.
# node = "C:/Users/<user>/Tools/node/node.exe"

[projects.example]
repo = "C:/Users/<user>/Documents/example-repo"
base_ref = "HEAD"
result_mode = "keep_worktree"
require_clean_source = true

[projects.example.toolchain]
# Compatibility fallback when [projects.example.runtime] is absent.
project_python = "{project_root}/.venv/Scripts/python.exe"
node = "C:/Users/<user>/Tools/node/node.exe"
# jest = "{project_root}/node_modules/jest/bin/jest.js"

[projects.example.runtime]
# Optional authoritative per-worktree Python runtime.
bootstrap_python = "C:/Users/<user>/AppData/Local/Programs/Python/Python312/python.exe"
expected_python = "3.12"
venv = ".venv"
dependency_files = ["requirements.txt"]
pip_install_args = ["--disable-pip-version-check"]

[projects.example.runtime_verification]
# Optional Controller-owned runtime proof scenarios. They are used only when
# verification-plan.v1 requires the matching profile/capabilities.
enabled = false

# Example LIVE_LOCAL scenario:
# [[projects.example.runtime_verification.scenarios]]
# id = "local-app-smoke"
# profile = "LIVE_LOCAL"
# capabilities = ["LOCAL_APP"]
# startup_command = ["{python}", "manage.py", "runserver", "127.0.0.1:{runtime_port}", "--noreload"]
# health_command = ["{python}", "tools/runtime_health.py", "{runtime_port}"]
# command = ["{python}", "tools/runtime_local_smoke.py"]
# The command reads SLIVIN_RUNTIME_REQUEST and writes runtime-result.v1 JSON to
# SLIVIN_RUNTIME_RESULT. Preserved secret values are redacted from saved evidence/logs.
# timeout_seconds = 300
# startup_timeout_seconds = 60
# cleanup_timeout_seconds = 60
# preserve_env = []
#
# TEST_EXTERNAL additionally requires cleanup_command or disposable = true.
# PROD_OBSERVE requires read_only_enforced = true and cannot define startup/cleanup.

[projects.example.workspace]
# Prefer repository-owned .worktreeinclude for ignored runtime files such as .env.
# copy_untracked remains a machine-local, project-specific override. Keep the
# generic profile empty; declare a source-owned dependency tree only in the
# project profile that actually has it (see matrix_baseline below).
copy_untracked = []

# Required only when copy_untracked intentionally includes .env, *.pem,
# credentials.json or another sensitive path. The agent can read it.
allow_sensitive_copy = false

[projects.matrix_baseline]
repo = "C:/Users/<user>/Downloads/sa_icover_90"
base_ref = "HEAD"
result_mode = "keep_worktree"
require_clean_source = true

[projects.matrix_baseline.toolchain]
project_python = "{project_root}/.venv/Scripts/python.exe"
node = "C:/Users/<user>/Tools/node/node.exe"
jest = "{project_root}/node_modules/jest/bin/jest.js"

[projects.matrix_baseline.workspace]
# Rebind source-local Jest to this Controller-copied runtime tree in a
# standalone historical workspace. The source node_modules must already exist.
copy_untracked = ["node_modules"]
