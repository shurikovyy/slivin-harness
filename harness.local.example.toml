# Copy this file to harness.local.toml and adjust machine-local paths.
# harness.local.toml is ignored and must not be committed or shipped.

[codex]
command = "C:/Users/<user>/Tools/codex-cli/node_modules/.bin/codex.cmd"

[workspace]
# Keep this path short on Windows.
root = "C:/Users/<user>/.slivin-harness/workspaces"

[toolchain]
# Optional tools shared by all projects. Repair checks and Implementer self-verify use these exact paths.
# node = "C:/Users/<user>/Tools/node/node.exe"

[projects.example]
repo = "C:/Users/<user>/Documents/example-repo"
base_ref = "HEAD"
result_mode = "keep_worktree"
require_clean_source = true

[projects.example.toolchain]
project_python = "{project_root}/.venv/Scripts/python.exe"
node = "C:/Users/<user>/Tools/node/node.exe"
# jest = "{project_root}/node_modules/jest/bin/jest.js"

[projects.example.workspace]
# Local untracked runtime files are not copied unless listed here.
copy_untracked = []

# Required only when copy_untracked intentionally includes .env, *.pem,
# credentials.json or another sensitive path. The agent can read it.
allow_sensitive_copy = false

[projects.matrix_baseline]
repo = "C:/Users/<user>/Downloads/sa_icover_90"
base_ref = "HEAD"
result_mode = "keep_worktree"
require_clean_source = true

[projects.matrix_baseline.toolchain]
project_python = "{project_root}/.venv/Scripts/python.exe"
node = "C:/Users/<user>/Tools/node/node.exe"
jest = "{project_root}/node_modules/jest/bin/jest.js"
