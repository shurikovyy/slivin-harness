version = 2

task_id = "EXAMPLE_LOCAL_FIX"
project = "example"
workspace_mode = "git_worktree"
base_ref = "HEAD"
result_mode = "keep_worktree"

# low: Implementer → checks
# medium/high: Planner → Implementer → checks → Evaluator
risk = "low"
max_fix_cycles = 1
max_replan_cycles = 0
turn_timeout_seconds = 900
require_clean_git = true

prompt = """
Исправь небольшой локальный дефект в example project.
Сохрани существующее поведение, добавь регрессионный тест
и обнови документацию, если меняется контракт.
"""

# Optional owner-defined hard boundary. Omit it when the correct
# change surface is not known in advance.
# allowed_paths = ["src/component/", "tests/component/"]

[[checks]]
name = "Unit tests"
feedback = "repair"
command = ["{python}", "-m", "pytest", "tests/test_target.py", "-q"]
timeout_seconds = 180

[[checks]]
name = "Git diff check"
feedback = "repair"
command = ["git", "diff", "--check"]
timeout_seconds = 30
